<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediAssistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        /* ── Reset & Base ───────────────────────────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-card: rgba(0, 0, 0, 0.03);
            --bg-glass: rgba(0, 0, 0, 0.04);
            --border: rgba(0, 0, 0, 0.10);
            --text-primary: #1a1a2e;
            --text-secondary: #555770;
            --text-muted: #8e8ea0;
            --accent: #5b4cff;
            --accent-hover: #6d5fff;
            --accent-glow: rgba(91, 76, 255, 0.15);
            --user-bubble: linear-gradient(135deg, #5b4cff 0%, #7c6cff 100%);
            --assistant-bubble: #ffffff;
            --danger: #e53e5c;
            --success: #22c55e;
            --radius: 14px;
            --radius-sm: 10px;
            --sidebar-w: 280px;
            --transition: 0.2s cubic-bezier(.4, 0, .2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* ── Sidebar ────────────────────────────────────── */
        .sidebar {
            width: var(--sidebar-w);
            min-width: var(--sidebar-w);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform var(--transition);
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px 18px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header .logo {
            width: 34px;
            height: 34px;
            background: var(--user-bubble);
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .sidebar-header h1 {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .new-chat-btn {
            margin: 8px 14px 14px;
            padding: 11px 16px;
            background: var(--bg-glass);
            border: 1px dashed var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all var(--transition);
        }

        .new-chat-btn:hover {
            background: var(--accent-glow);
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .thread-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 14px;
        }

        .thread-list::-webkit-scrollbar {
            width: 4px;
        }

        .thread-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .thread-item {
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            white-space: nowrap;
            overflow: hidden;
        }

        .thread-item:hover {
            background: var(--bg-glass);
            color: var(--text-primary);
        }

        .thread-item.active {
            background: var(--accent-glow);
            color: var(--text-primary);
            border: 1px solid rgba(108, 99, 255, 0.2);
        }

        .thread-item .title {
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .thread-item .delete-btn {
            opacity: 0;
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 14px;
            padding: 2px 4px;
            border-radius: 4px;
            transition: opacity var(--transition);
            flex-shrink: 0;
        }

        .thread-item:hover .delete-btn {
            opacity: 0.7;
        }

        .thread-item .delete-btn:hover {
            opacity: 1;
            background: rgba(255, 77, 106, 0.12);
        }

        /* ── Main chat area ─────────────────────────────── */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(12px);
            background: rgba(240,242,245,0.85);
        }

        .chat-header .thread-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-header .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            flex-shrink: 0;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        /* ── Messages ───────────────────────────────────── */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 24px 12px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .messages::-webkit-scrollbar {
            width: 5px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .msg {
            max-width: 72%;
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 14px;
            line-height: 1.65;
            animation: msgIn 0.3s ease;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg.user {
            align-self: flex-end;
            background: var(--user-bubble);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .msg.assistant {
            align-self: flex-start;
            background: var(--assistant-bubble);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            color: var(--text-primary);
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        .msg.assistant .cursor-blink::after {
            content: '▌';
            animation: blink 0.7s step-end infinite;
            color: var(--accent);
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* ── Welcome screen ─────────────────────────────── */
        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: var(--text-muted);
            padding: 40px;
            text-align: center;
        }

        .welcome .icon {
            width: 64px;
            height: 64px;
            background: var(--user-bubble);
            border-radius: 18px;
            display: grid;
            place-items: center;
            font-size: 30px;
            box-shadow: 0 8px 32px var(--accent-glow);
        }

        .welcome h2 {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .welcome p {
            font-size: 14px;
            max-width: 380px;
            line-height: 1.6;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
        }

        .suggestion {
            padding: 8px 14px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 12.5px;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--transition);
        }

        .suggestion:hover {
            background: var(--accent-glow);
            border-color: var(--accent);
            color: var(--text-primary);
        }

        /* ── Input bar ──────────────────────────────────── */
        .input-bar {
            padding: 14px 24px 20px;
            border-top: 1px solid var(--border);
            background: rgba(240,242,245,0.9);
            backdrop-filter: blur(12px);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 4px 6px 4px 16px;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            resize: none;
            padding: 10px 0;
            max-height: 120px;
            line-height: 1.5;
        }

        .input-wrapper textarea::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 38px;
            height: 38px;
            background: var(--user-bubble);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all var(--transition);
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .send-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ── Responsive ─────────────────────────────────── */
        @media (max-width: 700px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .msg {
                max-width: 90%;
            }
        }

        /* ── Spinner ────────────────────────────────────── */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 14px 16px;
            align-self: flex-start;
        }

        .typing-indicator span {
            width: 7px;
            height: 7px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s ease-in-out infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-8px);
            }
        }
    </style>
</head>

<body>

    <!-- ── Sidebar ──────────────────────────────────── -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">🩺</div>
            <h1>MediAssistant</h1>
        </div>
        <button class="new-chat-btn" id="newChatBtn" onclick="startNewChat()">
            <span>＋</span> New Chat
        </button>
        <div class="thread-list" id="threadList"></div>
    </aside>

    <!-- ── Main ─────────────────────────────────────── -->
    <main class="main">
        <div class="chat-header" id="chatHeader">
            <div class="status-dot"></div>
            <div class="thread-title" id="chatTitle">New Chat</div>
        </div>

        <!-- Welcome screen (shown when no messages) -->
        <div class="welcome" id="welcomeScreen">
            <div class="icon">🩺</div>
            <h2>Welcome to MediAssistant</h2>
            <p>Your AI-powered medical assistant. Ask me anything about symptoms, conditions, medications, or general
                health.</p>
            <div class="suggestions">
                <button class="suggestion" onclick="sendSuggestion(this)">What are flu symptoms?</button>
                <button class="suggestion" onclick="sendSuggestion(this)">Common headache remedies</button>
                <button class="suggestion" onclick="sendSuggestion(this)">How does ibuprofen work?</button>
                <button class="suggestion" onclick="sendSuggestion(this)">Signs of dehydration</button>
            </div>
        </div>

        <!-- Messages container (hidden until first message) -->
        <div class="messages" id="messages" style="display:none;"></div>

        <div class="input-bar">
            <div class="input-wrapper">
                <textarea id="msgInput" rows="1" placeholder="Ask a medical question…" onkeydown="handleKey(event)"
                    oninput="autoGrow(this)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </main>

    <script>
        // ── Config ──────────────────────────────────────────
        const API = '/api/v1';
        const USER_ID = 'default-user';

        let currentThreadId = null;
        let isStreaming = false;

        // ── Helpers ─────────────────────────────────────────
        function uuid() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0;
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            });
        }

        function headers(json = false) {
            const h = { 'X-User-ID': USER_ID };
            if (json) h['Content-Type'] = 'application/json';
            return h;
        }

        function scrollToBottom() {
            const el = document.getElementById('messages');
            el.scrollTop = el.scrollHeight;
        }

        function autoGrow(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        }

        // ── Thread list ─────────────────────────────────────
        async function loadThreads() {
            try {
                const res = await fetch(`${API}/threads`, { headers: headers() });
                if (!res.ok) return;
                const threads = await res.json();
                renderThreadList(threads);
            } catch (e) {
                console.error('Failed to load threads', e);
            }
        }

        function renderThreadList(threads) {
            const list = document.getElementById('threadList');
            list.innerHTML = '';
            // Sort by updated_at desc
            threads.sort((a, b) => new Date(b.updated_at || 0) - new Date(a.updated_at || 0));
            threads.forEach(t => {
                const div = document.createElement('div');
                div.className = 'thread-item' + (t.thread_id === currentThreadId ? ' active' : '');
                div.innerHTML = `
      <span class="title">${escHtml(t.title || 'Untitled')}</span>
      <button class="delete-btn" title="Delete" onclick="event.stopPropagation(); deleteThread('${t.thread_id}')">✕</button>
    `;
                div.addEventListener('click', () => switchThread(t.thread_id, t.title));
                list.appendChild(div);
            });
        }

        function escHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        // ── Thread actions ──────────────────────────────────
        function startNewChat() {
            currentThreadId = uuid();
            document.getElementById('chatTitle').textContent = 'New Chat';
            document.getElementById('messages').innerHTML = '';
            document.getElementById('messages').style.display = 'none';
            document.getElementById('welcomeScreen').style.display = '';
            highlightActiveThread();
            document.getElementById('msgInput').focus();
        }

        async function switchThread(threadId, title) {
            currentThreadId = threadId;
            document.getElementById('chatTitle').textContent = title || 'Chat';
            highlightActiveThread();
            await loadHistory(threadId);
        }

        function highlightActiveThread() {
            document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.thread-item').forEach(el => {
                // match by thread id stored in onclick
                if (el.querySelector('.title')?.textContent && el.classList) {
                    // re-render is simpler
                }
            });
            loadThreads(); // quick re-render to highlight
        }

        async function deleteThread(threadId) {
            if (!confirm('Delete this conversation?')) return;
            try {
                await fetch(`${API}/threads/${threadId}`, { method: 'DELETE', headers: headers() });
                if (threadId === currentThreadId) startNewChat();
                loadThreads();
            } catch (e) {
                console.error('Delete failed', e);
            }
        }

        // ── History ─────────────────────────────────────────
        async function loadHistory(threadId) {
            const msgContainer = document.getElementById('messages');
            const welcome = document.getElementById('welcomeScreen');
            msgContainer.innerHTML = '';

            try {
                const res = await fetch(`${API}/history/${threadId}`, { headers: headers() });
                if (!res.ok) { welcome.style.display = ''; msgContainer.style.display = 'none'; return; }
                const data = await res.json();
                if (!data.messages || data.messages.length === 0) {
                    welcome.style.display = '';
                    msgContainer.style.display = 'none';
                    return;
                }
                welcome.style.display = 'none';
                msgContainer.style.display = 'flex';
                data.messages.forEach(m => {
                    if (m.role === 'user' || m.role === 'assistant') {
                        appendMessage(m.role, m.content);
                    }
                });
                scrollToBottom();
            } catch (e) {
                console.error('Failed to load history', e);
            }
        }

        // ── Send message ────────────────────────────────────
        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function sendSuggestion(btn) {
            document.getElementById('msgInput').value = btn.textContent;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text || isStreaming) return;

            // Ensure we have a thread
            if (!currentThreadId) currentThreadId = uuid();

            const msgContainer = document.getElementById('messages');
            const welcome = document.getElementById('welcomeScreen');
            welcome.style.display = 'none';
            msgContainer.style.display = 'flex';

            // Show user message
            appendMessage('user', text);
            input.value = '';
            input.style.height = 'auto';
            scrollToBottom();

            // Start streaming
            isStreaming = true;
            document.getElementById('sendBtn').disabled = true;

            // Create assistant bubble
            const assistantDiv = document.createElement('div');
            assistantDiv.className = 'msg assistant';
            assistantDiv.innerHTML = '<span class="cursor-blink"></span>';
            msgContainer.appendChild(assistantDiv);
            scrollToBottom();

            try {
                const res = await fetch(`${API}/chat`, {
                    method: 'POST',
                    headers: headers(true),
                    body: JSON.stringify({ message: text, thread_id: currentThreadId }),
                });

                if (!res.ok) {
                    const err = await res.text();
                    assistantDiv.textContent = `Error: ${err}`;
                    finishStream();
                    return;
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    fullText += chunk;
                    assistantDiv.textContent = fullText;
                    // Re-add cursor
                    const cursor = document.createElement('span');
                    cursor.className = 'cursor-blink';
                    assistantDiv.appendChild(cursor);
                    scrollToBottom();
                }

                // Remove cursor when done
                assistantDiv.textContent = fullText;
            } catch (e) {
                assistantDiv.textContent = `Connection error: ${e.message}`;
            }

            finishStream();
            loadThreads(); // refresh sidebar
        }

        function finishStream() {
            isStreaming = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('msgInput').focus();
        }

        function appendMessage(role, content) {
            const msgContainer = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.textContent = content;
            msgContainer.appendChild(div);
        }

        // ── Init ────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            startNewChat();
            loadThreads();
        });
    </script>
</body>

</html>
